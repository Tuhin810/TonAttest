<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TonAttest — Demo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #707579);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --surface: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --ok: #2e9e5b;
    --warn: #c0803a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--hint); margin: 0 0 24px; font-size: 14px; }
  .balance {
    background: var(--surface); border-radius: 14px; padding: 20px;
    text-align: center; margin-bottom: 20px;
  }
  .balance .n { font-size: 40px; font-weight: 650; line-height: 1; }
  .balance .l { color: var(--hint); font-size: 13px; margin-top: 6px; }
  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; font-size: 15px;
    border: 1px solid var(--surface); background: var(--surface); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 18px; padding: 14px; border-radius: 10px; background: var(--surface); font-size: 14px; }
  .msg.ok { border-left: 3px solid var(--ok); }
  .msg.no { border-left: 3px solid var(--warn); }
  /* The evidence panel is the point of the demo: a user can see exactly why
     the answer is what it is, down to the transactions that counted. */
  .ev { margin-top: 14px; background: var(--surface); border-radius: 10px; padding: 14px; }
  .ev h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
           color: var(--hint); margin: 0 0 10px; }
  .leaf { padding: 8px 0; border-top: 1px solid rgba(128,128,128,.18); }
  .leaf:first-of-type { border-top: 0; }
  .leaf .k { font-weight: 600; font-size: 13px; }
  .leaf .d { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .leaf .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 11px; color: var(--hint); margin-top: 6px; word-break: break-all; }
  .pass { color: var(--ok); } .fail { color: var(--warn); }
</style>
</head>
<body>
  <h1>Swap on STON.fi, earn points</h1>
  <p class="sub">Points are awarded by this app. The verification service only proves what you did on-chain — it never holds or moves funds.</p>

  <div class="balance">
    <div class="n" id="balance">0</div>
    <div class="l">points</div>
  </div>

  <label for="wallet">Your TON wallet</label>
  <input id="wallet" placeholder="EQ… or 0:…" autocomplete="off" spellcheck="false" />
  <button id="claim">Check activity &amp; claim</button>

  <div id="out"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const $ = (id) => document.getElementById(id);
  const out = $("out");

  // In production this comes from validated initData on the server, never from
  // the client. Binding a reward to a Telegram identity is what makes running
  // many wallets expensive.
  const telegramUserId = String(tg?.initDataUnsafe?.user?.id ?? "demo-user");

  $("claim").addEventListener("click", async () => {
    const wallet = $("wallet").value.trim();
    if (!wallet) { out.innerHTML = '<div class="msg no">Enter a wallet address first.</div>'; return; }

    $("claim").disabled = true;
    out.innerHTML = '<div class="msg">Checking your STON.fi activity…</div>';

    try {
      const res = await fetch("/api/claim", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ wallet, telegramUserId }),
      });
      const data = await res.json();
      render(data, res.status);
    } catch {
      out.innerHTML = '<div class="msg no">Could not reach the server. Try again.</div>';
    } finally {
      $("claim").disabled = false;
    }
  });

  function render(data, status) {
    if (typeof data.balance === "number") $("balance").textContent = data.balance;

    let html = "";
    if (status >= 500 || data.retryable) {
      // Never tell a user they don't qualify when the truth is "we couldn't check".
      html = `<div class="msg no">${escape(data.error ?? "Temporarily unavailable — try again shortly.")}</div>`;
    } else if (data.error) {
      html = `<div class="msg no">${escape(data.error)}</div>`;
    } else if (data.eligible && data.awarded) {
      html = `<div class="msg ok">You qualified — <strong>+${data.points} points</strong>.</div>`;
    } else if (data.eligible && !data.awarded) {
      html = `<div class="msg no">${escape(data.reason ?? "Already claimed.")}</div>`;
    } else {
      html = `<div class="msg no">Not eligible yet. Here's exactly why:</div>`;
    }

    if (data.evidence) html += renderEvidence(data.evidence);
    out.innerHTML = html;
  }

  function renderEvidence(evidence) {
    const leaves = [];
    (function walk(node) {
      if (!node) return;
      if (node.children) node.children.forEach(walk);
      else leaves.push(node);
    })(evidence.root);

    const rows = leaves.map((leaf) => `
      <div class="leaf">
        <div class="k ${leaf.satisfied ? "pass" : "fail"}">
          ${leaf.satisfied ? "✓" : "✗"} ${escape(leaf.kind)}
        </div>
        <div class="d">${escape(leaf.detail)}</div>
        ${leaf.txHashes?.length ? `<div class="m">${leaf.txHashes.length} tx: ${escape(leaf.txHashes.slice(0, 3).join(", "))}</div>` : ""}
      </div>`).join("");

    const disq = evidence.disqualified
      ? `<div class="leaf"><div class="k fail">✗ wallet</div><div class="d">${escape(evidence.disqualified)}</div></div>`
      : "";

    return `<div class="ev"><h2>Evidence</h2>${disq}${rows}</div>`;
  }

  function escape(value) {
    return String(value).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
</script>
</body>
</html>
